<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CertiVision SPGG Pitch Deck</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap");

      :root {
        --bg: #f6f7f3;
        --surface: rgba(255, 255, 255, 0.82);
        --surface-strong: rgba(255, 255, 255, 0.94);
        --line: rgba(18, 28, 45, 0.1);
        --text: #0f1728;
        --muted: #5a6476;
        --accent: #0f766e;
        --accent-soft: rgba(15, 118, 110, 0.12);
        --danger: #b42318;
        --shadow: 0 28px 70px rgba(23, 32, 53, 0.12);
        --radius-xl: 28px;
        --radius-lg: 22px;
        --radius-md: 16px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Manrope", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 28%),
          radial-gradient(circle at top right, rgba(59, 130, 246, 0.12), transparent 22%),
          linear-gradient(180deg, #fbfbf8 0%, #f2f4ef 100%);
      }

      img {
        max-width: 100%;
        display: block;
      }

      button {
        font: inherit;
      }

      .deck {
        width: min(1180px, calc(100vw - 24px));
        margin: 0 auto;
        padding: 18px 0 56px;
      }

      .topbar {
        position: sticky;
        top: 10px;
        z-index: 20;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        margin-bottom: 20px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(246, 247, 243, 0.84);
        backdrop-filter: blur(16px);
      }

      .brand {
        min-width: 0;
      }

      .brand-mark {
        display: block;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .brand-title {
        display: block;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: 16px;
        font-weight: 800;
        color: var(--text);
      }

      .nav {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .nav::-webkit-scrollbar {
        display: none;
      }

      .nav button {
        flex: 0 0 auto;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: 160ms ease;
      }

      .nav button.active {
        background: var(--text);
        color: #fff;
        border-color: var(--text);
      }

      .slide {
        display: none;
        animation: fade 220ms ease;
      }

      .slide.active {
        display: block;
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        background: var(--surface);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .panel-inner {
        padding: 24px;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 10px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .headline {
        margin: 0;
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: clamp(32px, 5vw, 64px);
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      .subhead {
        max-width: 62ch;
        margin: 14px 0 0;
        font-size: clamp(15px, 2vw, 19px);
        line-height: 1.7;
        color: var(--muted);
      }

      .hero-grid,
      .two-col,
      .three-col,
      .stats,
      .cards,
      .roadmap {
        display: grid;
        gap: 16px;
      }

      .hero-grid {
        grid-template-columns: 1.2fr 0.8fr;
        align-items: stretch;
      }

      .three-col {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .two-col {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin-top: 22px;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .roadmap {
        grid-template-columns: 1fr;
      }

      .card {
        min-width: 0;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: var(--surface-strong);
      }

      .card.soft {
        background: linear-gradient(180deg, rgba(15, 118, 110, 0.08), rgba(255, 255, 255, 0.96));
      }

      .metric {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 124px;
      }

      .metric-value {
        font-family: "Plus Jakarta Sans", sans-serif;
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .metric-label {
        margin-top: 10px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .stack {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      .pill {
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
      }

      .municipio-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100%;
        background:
          linear-gradient(180deg, rgba(15, 118, 110, 0.08), rgba(255, 255, 255, 0.94)),
          #ffffff;
      }

      .municipio-visual {
        display: grid;
        place-items: center;
        padding: 18px;
        border-radius: 22px;
        background:
          radial-gradient(circle at center, rgba(15, 118, 110, 0.12), transparent 58%),
          #f8faf8;
        border: 1px solid rgba(15, 118, 110, 0.12);
      }

      .municipio-visual img {
        width: min(220px, 52vw);
        aspect-ratio: 1;
        object-fit: contain;
        filter: drop-shadow(0 18px 34px rgba(15, 23, 40, 0.12));
      }

      .small-label {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .body-copy,
      .bullet {
        margin: 0;
        font-size: 15px;
        line-height: 1.7;
        color: var(--muted);
      }

      .card-title {
        margin: 0 0 8px;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .quote {
        padding: 18px 20px;
        border-left: 3px solid var(--accent);
        border-radius: 0 18px 18px 0;
        background: rgba(15, 118, 110, 0.06);
        color: #24403d;
        font-size: 17px;
        line-height: 1.7;
      }

      .timeline-item {
        display: grid;
        grid-template-columns: 40px 1fr;
        gap: 14px;
        align-items: start;
      }

      .timeline-dot {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--text);
        color: #fff;
        font-size: 12px;
        font-weight: 800;
      }

      .danger {
        color: var(--danger);
      }

      .footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      .cta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      .cta .pill {
        background: var(--text);
        color: #fff;
      }

      .full-image {
        width: 100%;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, #f7faf7, #edf6f2);
        padding: 20px;
      }

      .full-image img {
        width: min(320px, 100%);
        margin: 0 auto;
      }

      @media (max-width: 980px) {
        .hero-grid,
        .two-col,
        .three-col,
        .stats,
        .cards {
          grid-template-columns: 1fr;
        }

        .topbar {
          border-radius: 24px;
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (max-width: 720px) {
        .deck {
          width: min(100vw - 16px, 100%);
          padding-top: 10px;
        }

        .panel-inner {
          padding: 18px;
        }

        .headline {
          font-size: clamp(28px, 11vw, 46px);
        }

        .subhead,
        .body-copy,
        .bullet,
        .quote {
          font-size: 14px;
        }

        .footer {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="deck">
      <div class="topbar">
        <div class="brand">
          <span class="brand-mark">TechEx Hackathon 2026</span>
          <span class="brand-title">CertiVision SPGG</span>
        </div>
        <div class="nav" id="nav"></div>
      </div>

      <div id="slides"></div>
    </div>

    <script>

            <section class="slide-content panel">
              <div class="panel-inner">

                  <div>

                  <span class="pill">Aglomeración</span>
                </div>

              </div>

          `,
        },
        {
          label: "04 Demo",
          html: `
            <section class="slide-content panel">
              <div class="panel-inner">
                <span class="eyebrow">Experiencia demo</span>
                <h2 class="headline">Lo que ve el juez<br>en menos de un minuto.</h2>
                <div class="two-col" style="margin-top:20px;">
                  <div class="card">
                    <p class="small-label">Fase 1</p>
                    <h3 class="card-title">Análisis de archivo</h3>

                </div>

                  <div class="card timeline-item">
                    <div class="timeline-dot">01</div>
                    <div>
                      <h3 class="card-title">Fuente visible</h3>
                      <p class="body-copy">El operador sabe si la IA está leyendo un archivo, una cámara o un stream.</p>
                    </div>
                  </div>
                  <div class="card timeline-item">
                    <div class="timeline-dot">02</div>
                    <div>
                      <h3 class="card-title">Interpretación humana</h3>
                      <p class="body-copy">La interfaz verbaliza lo que la IA cree que ocurre: normalidad, observación o riesgo.</p>
                    </div>
                  </div>
                  <div class="card timeline-item">
                    <div class="timeline-dot">03</div>
                    <div>
                      <h3 class="card-title danger">Disparo de alerta</h3>

                </div>

              </div>

        },
        {
          label: "05 Stack",
          html: `

                <div class="cards" style="margin-top:20px;">
                  <div class="card">
                    <h3 class="card-title">Visión e inferencia</h3>

                  <div class="card">

                    <p class="body-copy">FFmpeg y OpenCV resuelven ingesta, muestreo de frames y preparación de fuente para inferencia.</p>
                  </div>
                  <div class="card">
                    <h3 class="card-title">Bitácora auditable</h3>
                    <p class="body-copy">PostgreSQL append-only y hashes encadenados para verificar integridad de cada análisis.</p>
                  </div>
                </div>
                <div class="footer"><span>CertiVision SPGG</span><span>Slide 5 / 7</span></div>
              </div>
            </section>
          `,
        },
        {
          label: "06 SPGG",
          html: `
            <section class="slide-content panel">
              <div class="panel-inner">
                <span class="eyebrow">Enfoque territorial</span>
                <h2 class="headline">Empezar en SPGG<br>tiene sentido.</h2>

                    </div>
                  </div>
                </div>
                <div class="footer"><span>CertiVision SPGG</span><span>Slide 6 / 7</span></div>

          `,
        },
        {
          label: "07 Cierre",
          html: `
            <section class="slide-content panel">
              <div class="panel-inner">
                <span class="eyebrow">Cierre</span>
                <h2 class="headline">No es un proyecto<br>de cámaras.<br>Es un proyecto de confianza.</h2>
                <p class="subhead">CertiVision convierte vigilancia en una cadena visible: fuente, interpretación, alerta y evidencia. Eso es lo que hace defendible la operación pública.</p>
                <div class="cta">
                  <span class="pill">Menos opacidad</span>
                  <span class="pill">Más reacción</span>
                  <span class="pill">Más trazabilidad</span>
                </div>
                <div class="quote" style="margin-top:20px;">La corrupción necesita oscuridad y memoria selectiva. CertiVision elimina ambas.</div>
                <div class="footer"><span>CertiVision SPGG</span><span>Slide 7 / 7</span></div>
              </div>
            </section>
          `,
        },
      ];

      const navEl = document.getElementById("nav");
      const slidesEl = document.getElementById("slides");

      function activateSlide(index) {
        document.querySelectorAll(".nav button").forEach((button, buttonIndex) => {
          button.classList.toggle("active", buttonIndex === index);
        });
        document.querySelectorAll(".slide").forEach((slide, slideIndex) => {
          slide.classList.toggle("active", slideIndex === index);
        });
      }

      slides.forEach((slide, index) => {
        const button = document.createElement("button");
        button.textContent = slide.label;
        if (index === 0) button.classList.add("active");
        button.addEventListener("click", () => activateSlide(index));
        navEl.appendChild(button);

        const section = document.createElement("section");
        section.className = `slide${index === 0 ? " active" : ""}`;
        section.innerHTML = slide.html;
        slidesEl.appendChild(section);
      });
    </script>
  </body>
</html>
